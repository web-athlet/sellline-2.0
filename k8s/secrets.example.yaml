# TEMPLATE ONLY — do NOT commit real secret values. Apply the populated version
# out-of-band (sealed-secrets / external-secrets / `kubectl create secret`), never
# from a file checked into git. Keys mirror the env table in CLAUDE.md.
apiVersion: v1
kind: Secret
metadata:
  name: nextgen-secrets
  namespace: nextgen-prod
type: Opaque
stringData:
  # --- core ---
  DATABASE_URL: 'postgresql://USER:PASS@nextgen-db.eu:5432/nextgen?schema=public'
  REDIS_URL: 'redis://nextgen-redis.eu:6379'
  NEXT_PUBLIC_API_URL: 'https://api.nextgen-crm.com'
  NEXT_PUBLIC_WS_URL: 'wss://api.nextgen-crm.com'
  NEXT_PUBLIC_WEB_URL: 'https://nextgen-crm.com'
  # --- auth / crypto (>=32 chars; ENCRYPTION_KEY = exactly 64 hex chars) ---
  JWT_SECRET: 'CHANGE_ME_32_CHARS_MIN'
  NEXTAUTH_SECRET: 'CHANGE_ME_32_CHARS_MIN'
  NEXTAUTH_URL: 'https://nextgen-crm.com'
  ENCRYPTION_KEY: 'CHANGE_ME_64_HEX_CHARS'
  CSRF_SECRET: 'CHANGE_ME_32_CHARS_MIN'
  CAMPAIGN_TRACKING_SECRET: 'CHANGE_ME_32_CHARS_MIN'
  EMAIL_OAUTH_STATE_SECRET: 'CHANGE_ME_32_CHARS_MIN'
  # --- integrations (optional; leave empty to disable the related feature) ---
  OPENAI_API_KEY: ''
  SERPER_API_KEY: ''
  MINIO_ENDPOINT: ''
  MINIO_ACCESS_KEY: ''
  MINIO_SECRET_KEY: ''
  MINIO_BUCKET: 'nextgen'
