apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextgen-web
  namespace: nextgen-prod
  labels: { app: nextgen-web }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # zero-downtime: never drop below desired ready count
  selector:
    matchLabels: { app: nextgen-web }
  template:
    metadata:
      labels: { app: nextgen-web }
    spec:
      nodeSelector:
        topology.kubernetes.io/region: eu-central-1 # DSGVO: EU-only scheduling
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/web-athlet/sellline-2.0/nextgen-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - secretRef: { name: nextgen-secrets }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: '3000' }
---
apiVersion: v1
kind: Service
metadata:
  name: nextgen-web
  namespace: nextgen-prod
spec:
  type: ClusterIP
  selector: { app: nextgen-web }
  ports:
    - { name: http, port: 80, targetPort: 3000 }
