name: Deploy-Production

# Fires only after the CI workflow finishes successfully on main. The `production`
# environment carries a required-reviewer rule (GitHub Settings → Environments),
# so the deploy job pauses for manual approval before anything ships.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push images
    # Manual dispatch always builds; workflow_run only on a green CI run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run checks out the default branch by default; pin to the SHA
          # that actually passed CI so we ship exactly what was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/nextgen-web:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}/nextgen-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/nextgen-api:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}/nextgen-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out to Kubernetes (EU)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production # required-reviewer approval gate
    steps:
      - uses: actions/checkout@v6
      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
      - name: Roll out new images
        env:
          SHA: ${{ needs.build-and-push.outputs.sha }}
        run: |
          kubectl -n nextgen-prod set image deployment/nextgen-web \
            web=${{ env.IMAGE_PREFIX }}/nextgen-web:${SHA}
          kubectl -n nextgen-prod set image deployment/nextgen-api \
            api=${{ env.IMAGE_PREFIX }}/nextgen-api:${SHA}
      - name: Wait for rollout (auto-rolls back on failure)
        run: |
          kubectl -n nextgen-prod rollout status deployment/nextgen-web --timeout=5m \
            || { kubectl -n nextgen-prod rollout undo deployment/nextgen-web; exit 1; }
          kubectl -n nextgen-prod rollout status deployment/nextgen-api --timeout=5m \
            || { kubectl -n nextgen-prod rollout undo deployment/nextgen-api; exit 1; }
