# NextGen CRM — Local Development Stack
# Services: Postgres 15 + pgvector, Redis 7, MinIO (S3-compatible).
# Production target: EU-region deployment (see docs/50-runbooks/deploy-production.md).

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: nextgen-postgres
    environment:
      POSTGRES_USER: nextgen
      POSTGRES_PASSWORD: nextgen
      POSTGRES_DB: nextgen
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nextgen -d nextgen']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nextgen-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: nextgen-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nextgen
      MINIO_ROOT_PASSWORD: nextgen-dev-only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
