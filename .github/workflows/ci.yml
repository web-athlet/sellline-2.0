name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches-ignore: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Lint and typecheck run in parallel (independent, fast).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm typecheck

  # 2. Unit tests + coverage. Coverage thresholds live in each package's
  #    vitest.config.ts (lines/functions/branches/statements), so a coverage
  #    drop fails this job and blocks the merge.
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm test:coverage

  # 3. Integration tests against a throwaway Postgres (pgvector) + Redis spun up
  #    by testcontainers on the runner's Docker daemon. Migrations are applied
  #    inside the global-setup, so no external `services:` block is needed.
  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm test:integration

  # 4. Build last — confirms the production bundles compile.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, unit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm build

  # Snyk runs in its own workflow (.github/workflows/snyk.yml).
  audit:
    name: pnpm audit (critical)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Audit-Level: critical bis Next-15-Migration (Session 15).
      - run: pnpm audit --audit-level=critical
