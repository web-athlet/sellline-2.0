apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nextgen-alerts
  namespace: nextgen-prod
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # --- Live today: derived from ingress-nginx + kube-state-metrics ---
    - name: nextgen.ingress
      rules:
        - alert: NextgenHigh5xxRate
          expr: |
            sum(rate(nginx_ingress_controller_requests{exported_namespace="nextgen-prod",status=~"5.."}[5m]))
              / sum(rate(nginx_ingress_controller_requests{exported_namespace="nextgen-prod"}[5m])) > 0.01
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: '5xx error rate > 1% (nextgen-prod)'
            runbook: docs/50-runbooks/rollback-procedure.md
        - alert: NextgenHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace="nextgen-prod"}[5m])) by (le)
            ) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: 'p95 request latency > 1s (nextgen-prod)'
    - name: nextgen.workloads
      rules:
        - alert: NextgenPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="nextgen-prod"}[15m]) > 0
          for: 10m
          labels: { severity: critical }
          annotations: { summary: 'Pod crash-looping in nextgen-prod' }
        - alert: NextgenDeploymentDegraded
          expr: |
            kube_deployment_status_replicas_available{namespace="nextgen-prod"}
              < kube_deployment_spec_replicas{namespace="nextgen-prod"}
          for: 10m
          labels: { severity: warning }
          annotations: { summary: 'Deployment has fewer ready replicas than desired' }

    # --- Pending /api/metrics (TD-S16b-02): enable once prom-client ships ---
    - name: nextgen.app
      rules:
        - alert: NextgenQueueDepthHigh
          expr: bullmq_queue_waiting{namespace="nextgen-prod"} > 1000
          for: 5m
          labels: { severity: warning }
          annotations: { summary: 'BullMQ queue depth > 1000 (enrichment/scoring backlog)' }
