name: E2E

# E2E runs on main only (post-merge) and on manual dispatch — the full Playwright
# matrix across 3 projects is too slow for every PR (Session 16a, Block 6/8).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium · firefox · mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # SCAFFOLD: the specs need stable data-testid hooks + a deterministic E2E
    # seed before they gate main. Left non-blocking until that work lands
    # (tracked in e2e/README.md). Flip `continue-on-error` to false to enforce.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run E2E
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_WEB_SERVER: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
